}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-variant-numeric:lining-nums;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Header + nav */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.1rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:.8rem;font-family:var(--mono)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="synced"] i{background:var(--good)}
.sync[data-s="saving"] i,.sync[data-s="pending"] i,.sync[data-s="connecting"] i{background:var(--hi)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.iconbtn[aria-current="page"]{border-color:var(--primary)}
.tabs{display:flex;flex:1;gap:4px;padding:0 0 10px}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
.tabs a:hover{background:var(--soft);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.tabs svg{width:18px;height:18px;flex:none}
main{padding:20px 0 120px}
@media (max-width:720px){
  .tabs{padding:0 0 6px;margin:0 -8px}

  .tabs a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 2px}
  .tabs a[aria-current="page"]{background:var(--soft);color:var(--ink)}
  .tabs a[aria-current="page"] svg{color:var(--primary)}
  h1{font-size:1.45rem}
}

.pill.s-bio{background:color-mix(in srgb,var(--bio) 16%,transparent);color:var(--bio)}
.pill.s-econ{background:color-mix(in srgb,var(--econ) 16%,transparent);color:var(--econ)}
.pill.s-geog{background:color-mix(in srgb,var(--geog) 16%,transparent);color:var(--geog)}
.pill.s-psych{background:color-mix(in srgb,var(--psych) 16%,transparent);color:var(--psych)}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.warnline{color:var(--warn);font-weight:600}
.subrow{align-items:center;flex-wrap:wrap;gap:10px}.subrow .dot{flex:none}
.subrow select,.seditor select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;max-width:100%}

.avcols{gap:6px}.avc{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;padding:0}.avc[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.trend{width:100%;height:auto;display:block}.trend .tg-grid{stroke:var(--line);stroke-width:1}.trend .tg-target{stroke:var(--hi);stroke-width:1.5;stroke-dasharray:5 4}.trend .tg-lab{fill:var(--muted);font-size:13px;font-family:var(--body)}
.tg-keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}.tg-key{display:inline-flex;align-items:center;gap:6px}.tg-key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.weekly-mini{font-size:.92rem;flex-wrap:wrap}

.pill.ust{background:var(--soft);color:var(--muted)}.pill.ust.resit{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@media (max-width:640px){ .li .meta.pp3 .btn.sm{flex:1 1 auto;min-width:auto;padding:7px 4px;font-size:.8rem;white-space:nowrap} .li .meta.pp3 .btn.primary{flex:1.5 1 0} .li .meta.pp3 .btn.planbtn{flex:0 0 auto;padding:7px 10px} }
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;font:inherit;font-weight:700;cursor:pointer}

.login{max-width:440px;margin:24px auto 0}

.authtabs{display:grid;grid-template-columns:1fr 1fr;width:100%;align-self:stretch}

.pwhint{font-weight:500}
.goodline{color:var(--good);font-weight:600}
.sentic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}.sentic svg{width:26px;height:26px}
.vfybar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.provrow{align-items:center}.provic{width:28px;display:grid;place-items:center;flex:none}
.subpanel{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.loginbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem}
.loginperks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn.danger{color:var(--bad)}
body.gate #tabs,body.gate #nav-search,body.gate #nav-settings,body.gate #fs-btn,body.gate #ret{display:none !important}
.schoolpick{position:relative}
div.f.schoolpick{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;flex:1;min-width:140px}
.sclist .t{color:var(--ink);font-size:.95rem;font-weight:600}.grid2.tight .sclist span.small{font-size:.8rem}
.sclist{position:absolute;left:0;right:0;top:100%;z-index:30;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:300px;overflow:auto}

.taskcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start;margin-top:10px}
.taskcols > div{min-width:0}
.colh{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem;letter-spacing:.03em;padding:6px 10px;border-radius:8px;background:var(--soft);margin-bottom:6px}
.colh.fin{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.nxmore{margin-top:6px;display:inline-block;min-height:40px;padding:10px 2px}.langsw{min-height:40px;padding:10px 6px}
.askmodes{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.askmodes button{padding:8px 6px;line-height:1.2}.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.edlist{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.examday .edexam{border-left:4px solid var(--primary)}
.edtom{border-left:4px solid var(--warn)}
#asksheet{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
#asksheet .askbox{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:700px){ #asksheet{align-items:center} #asksheet .askbox{border-radius:18px} }
body.asking{overflow:hidden}
.askme{align-self:flex-end;max-width:90%;background:var(--soft);border-radius:14px 14px 4px 14px;padding:8px 12px;white-space:pre-wrap;font-size:.95rem}
.askout{line-height:1.55;font-size:.98rem;overflow-wrap:anywhere}
.askthumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.askbtn{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.askrow{gap:8px;align-items:center}
.sbch{margin:6px 0 10px}
.pill.s-hist{background:color-mix(in srgb,var(--hist) 16%,transparent);color:var(--hist)}
.sgroups{gap:10px}.sgroup{display:flex;flex-direction:column;gap:6px}
details.sgdet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
details.sgdet>summary{cursor:pointer;padding:12px 14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.sgdet>.grid2{padding:0 12px 12px}
.offbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;max-width:min(560px,calc(100% - 20px));background:#2b2b2b;color:#fff;border-radius:12px;padding:8px 14px;font-size:13px;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.25);text-align:center}
body.offline a[href^="http"]{opacity:.55}
.dqimg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:8px;background:#fff}
.dqnote{margin-top:8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--hi) 14%,transparent);font-size:.92rem}
.dqnote b{display:block;font-size:.8rem;margin-bottom:2px}
.pill.s-cs{background:color-mix(in srgb,var(--cs) 16%,transparent);color:var(--cs)}
.pill.s-acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.pill.s-bus{background:color-mix(in srgb,var(--bus) 16%,transparent);color:var(--bus)}
.pill.s-enlang{background:color-mix(in srgb,var(--enlang) 16%,transparent);color:var(--enlang)}
.pill.s-enlit{background:color-mix(in srgb,var(--enlit) 16%,transparent);color:var(--enlit)}
.pill.s-law{background:color-mix(in srgb,var(--law) 16%,transparent);color:var(--law)}
.pill.s-it{background:color-mix(in srgb,var(--it) 16%,transparent);color:var(--it)}
.pill.s-fre{background:color-mix(in srgb,var(--fre) 16%,transparent);color:var(--fre)}
.pill.s-ger{background:color-mix(in srgb,var(--ger) 16%,transparent);color:var(--ger)}
.pill.s-spa{background:color-mix(in srgb,var(--spa) 16%,transparent);color:var(--spa)}
.pill.s-ara{background:color-mix(in srgb,var(--ara) 16%,transparent);color:var(--ara)}
.pill.s-gre{background:color-mix(in srgb,var(--gre) 16%,transparent);color:var(--gre)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem}
.res{gap:8px}
.res .btn.sm{margin-top:6px}
.btn.big{padding:13px 20px;font-size:1rem;min-height:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;flex:1;min-width:140px}
input:not([type]),input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-height:42px}
textarea{min-height:90px;resize:vertical}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:.92rem}

/* Today */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.countdown{background:var(--primary);color:var(--on-primary);border-color:var(--primary);display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.countdown .n{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.countdown .muted{color:color-mix(in srgb,var(--on-primary) 70%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.hot b{color:var(--warn)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;padding-top:8px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bar div{width:100%;max-width:36px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--primary) 75%,transparent);min-height:2px}
.bar.today div{background:var(--hi)}
.bar em{font-style:normal;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.barlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:.72rem;color:var(--muted);text-align:center;padding-top:4px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{overflow-wrap:anywhere}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:1.1rem;line-height:1}
.x:hover{color:var(--bad);background:var(--soft)}
.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:3px;font-size:.82rem;color:var(--muted)}
.prio{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;cursor:pointer;background:var(--surface);white-space:nowrap;color:var(--muted)}
.prio[data-v="1"]{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.prio[data-v="2"]{color:var(--ink);border-color:var(--hi);background:color-mix(in srgb,var(--hi) 16%,var(--surface))}
.li.p1{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.li.p1.done{box-shadow:none}
.soon{color:var(--warn)!important;font-weight:600}
.tasktext{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.grouph{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:14px 0 2px;display:flex;gap:8px}
.grouph.late{color:var(--bad)}
.qtext{white-space:pre-line}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;line-height:1.3}
.note:hover{border-color:var(--muted)}
.note.k-cards{background:color-mix(in srgb,var(--hi) 12%,var(--surface))}
.topic .grow{flex:1;min-width:0}
.deck{padding:12px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0}
.tqtopic{padding:12px 0;border-top:1px solid var(--line)}
.tqtopic:first-child{border-top:0}
.tqtopic .pmtrow:first-of-type{border-top:0}
.pmtq{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.pmtq>summary{cursor:pointer;padding:9px 0;font-size:.85rem;font-weight:600;color:var(--ink)}
.pmtrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.pmtrow.done .t{color:var(--muted)}
.seg{display:inline-flex;align-self:flex-start;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg a{padding:8px 14px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:.82rem}
.rate.dq3{grid-template-columns:repeat(3,1fr)}
.rate.dq3 button{padding:14px 4px;min-height:48px;justify-content:center}
.dqcard textarea{width:100%;min-height:110px;font:inherit;font-size:1rem}
.dqmine{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.dqcard .back{display:flex;flex-direction:column;gap:4px}
.dqsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.dqsum > div{padding:12px 4px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.dqsum b{font-size:1.6rem;font-family:var(--display);line-height:1.1}
.dqsum span{font-size:.8rem;color:var(--muted)}
.dqsum .g{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.dqsum .b{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.dqweak{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.dqdone{color:var(--good);font-weight:600}
.dqmark{display:flex;flex-direction:column;gap:6px}
.dqpts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dqpts li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:1rem;flex-wrap:wrap}
.dqpts li > .notr{flex:1;min-width:0}
.dqpts .ic{flex:none;width:20px;font-weight:800;text-align:center}
.dqpts .ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 9%,transparent)}
.dqpts .ok .ic{color:var(--good)}
.dqpts .miss{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:color-mix(in srgb,var(--bad) 7%,transparent)}
.dqpts .miss .ic{color:var(--bad)}
.dqpts .tagx{flex-basis:100%;padding-left:28px}
.rate button.sugg{border-width:2px;border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.gainu + .gainu{border-top:1px solid var(--line);padding-top:12px}
.chk{display:flex;gap:8px;align-items:flex-start;min-height:32px;font-size:.92rem}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.morebtn{align-self:flex-start;background:none;border:0;padding:8px 14px 8px 0;margin:-6px 0 -6px;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:.82rem;font-weight:700;min-height:40px;min-width:44px;text-align:left;display:block}
.stack > .morebtn{margin-top:-16px}
.pdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:6px}
.pdot.done{background:var(--good);border-color:var(--good)}
.answerbox{background:var(--soft);border-radius:10px;padding:10px 12px}
.editbox{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line);width:100%}
.overdue{color:var(--bad)!important}

/* Progress bars */
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good)}

/* Flashcard */
.flash{min-height:260px;display:flex;flex-direction:column;gap:14px;padding:22px}
.flash .front{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.3}
.flash .back{font-size:1.08rem;padding-top:14px;border-top:2px dashed var(--line);white-space:pre-line}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.rate button small{font-weight:400;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.rate .r0{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.rate .r3{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.progressline{height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--hi)}

/* Quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;font-size:1rem}
.opt b{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.explain{border-left:4px solid var(--hi);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;font-size:.95rem}
.score{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1}

/* Syllabus */
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.unit>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary .meter{grid-column:2/4}
details.unit[open]>summary{border-bottom:1px solid var(--line)}
.topic{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic span{flex:1}
.status{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--surface);min-width:104px}
.status[data-v="1"]{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.status[data-v="2"]{background:color-mix(in srgb,var(--hi) 22%,var(--surface));border-color:var(--hi)}
.status[data-v="3"]{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:var(--good);color:var(--good)}

/* Timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.clock{font-family:var(--display);font-weight:800;font-size:4.6rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.phase.brk{color:var(--good)}
.mini{position:fixed;right:16px;bottom:24px;z-index:25;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-family:var(--mono);font-size:.95rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
@media (max-width:720px){.mini{bottom:calc(16px + env(safe-area-inset-bottom))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;max-width:calc(100% - 32px)}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle:first-child{border-top:0}
.toggle input{width:20px;height:20px;accent-color:var(--primary)}
.mockbar{position:sticky;top:calc(var(--hdr,0px) + 8px);z-index:5;display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:10px 14px;border-radius:12px;background:var(--primary);color:var(--on-primary)}
.mockbar b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.mockbar .btn{background:var(--on-primary);color:var(--primary);border:0}
.mockbar .btn.ghost{background:transparent;color:var(--on-primary);border:1px solid color-mix(in srgb,var(--on-primary) 45%,transparent)}
.mockbar.over{background:var(--warn);color:#fff}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.award{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.big-grade{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}
.plan-box{border-radius:12px;padding:12px 14px;background:var(--soft)}
.plan-box p{margin:6px 0}
.ideas{margin:4px 0 0;padding-left:18px}
.ideas li{margin:3px 0}
.gval{min-width:110px;text-align:right;white-space:nowrap}
.gval .ums{font-family:var(--display);font-size:1.3rem}
.wiin{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wiin input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:right}
.li.wi{box-shadow:inset 3px 0 0 var(--hi);padding-left:10px}
.tgr{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.tgr .gp{font-size:.95rem}
.x.sm{width:20px;height:20px;font-size:.9rem;margin-left:2px}
/* ---- Touch & small-screen polish ---- */
button,a,.chip,.btn,input,select,label{touch-action:manipulation}
img,svg{max-width:100%}
.t,.li .grow,.award,.plan-box{overflow-wrap:anywhere}
@media (pointer:coarse), (max-width:900px){
  .check{position:relative}
  .check::before{content:"";position:absolute;inset:-10px}
  .x{min-width:40px;min-height:40px;display:inline-grid;place-items:center}
  .x.sm{min-width:30px;min-height:30px;width:auto;height:auto}
  .prio{padding:6px 12px;font-size:.78rem}
  .status{min-height:38px}
  .btn.sm{min-height:36px}
  .toggle{min-height:44px}
}
@media (max-width:560px){
  .li.gu{display:grid;grid-template-columns:1fr auto;gap:6px 10px}
  .li.gu > .grow{grid-column:1 / -1;min-width:0}
  .li.gu .gval{text-align:left;min-width:0;align-self:center}
  .li.gu > .row{justify-content:flex-end;align-items:flex-end}

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function todayStr(d = new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a, b){ const A = parseD(a), B = parseD(b); return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/86400000); }
function fmtDate(s, opts){ return parseD(s).toLocaleDateString('en-GB', opts || {weekday:'short', day:'numeric', month:'short', year:'numeric'}); }
function fmtMin(m){ m = Math.round(m); if (m < 60) return m + 'm'; return Math.floor(m/60) + 'h ' + (m%60 ? (m%60)+'m' : ''); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function scheduleSave(delay = 1200){

/* Progress is one record while small. Past ~400k characters it is split into parts
   (each well under the 1 MB per-record limit), so heavy long-term users never hit the cap. */
const CLOUD_INLINE_MAX = 400000, CLOUD_CHUNK = 250000;
function cloudBase(){ return 'data/users/' + cloud.id; }
async function cloudPut(){
  const json = JSON.stringify(state);
  if (json.length <= CLOUD_INLINE_MAX){ await cloud.ref.set({ v:1, updatedAt: state.updatedAt, state: JSON.parse(json) }); return; }
  const gen = uid(), n = Math.ceil(json.length / CLOUD_CHUNK);
  for (let i = 0; i < n; i++) await cloud.db.doc(cloudBase() + '/part' + i).set({ gen, i, s: json.slice(i * CLOUD_CHUNK, (i + 1) * CLOUD_CHUNK) });
  await cloud.ref.set({ v:2, updatedAt: state.updatedAt, gen, parts: n });
}
async function cloudState(d){
  if (!d) return null;
  if (d.v !== 2) return d.state ? JSON.parse(JSON.stringify(d.state)) : null;
  try {
    const snaps = await Promise.all(Array.from({ length: d.parts }, (_, i) => cloud.db.doc(cloudBase() + '/part' + i).get()));
    if (snaps.some(x => !x.exists || x.data().gen !== d.gen)) return null;   // a save is still in progress; the next update will bring it
    return JSON.parse(snaps.map(x => x.data().s).join(''));
  } catch(e){ return null; }
}
async function flush(){
  if (!cloud.ref || !dirty) return;
  if (saving){ saveTimer = setTimeout(flush, 600); return; }
  dirty = false; saving = true; setSync('saving');
  try {
    await cloudPut();
    setSync(dirty ? 'pending' : 'synced');
  } catch(e){
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted'){ dirty = true; saveTimer = setTimeout(flush, 1500 + Math.random()*2000); }
    else { cloud.ref = null; setSync('local'); if (code === 'quota_exceeded') toast('Cloud storage is full. Progress is still saved on this device.'); }
  } finally { saving = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty){ clearTimeout(saveTimer); flush(); } });

async function connectCloud(){
  if (!window.claude || typeof window.claude.use !== 'function'){ setSync('local'); return; }
  setSync('connecting');
  const slow = setTimeout(() => { if (cloud.status === 'connecting') setSync('slow'); }, 10000);
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user){ clearTimeout(slow); setSync('local'); return; }
    const id = await user.id();
    if (!id){ clearTimeout(slow); setSync('local'); return; }
    cloud.db = db; cloud.id = id; cloud.user = user;
    const ref = db.doc('data/users/' + id + '/state');
    const snap = await ref.get();
    clearTimeout(slow);
    cloud.ref = ref;
    const remote = snap.exists ? snap.data() : null;
    const rU = remote ? (remote.updatedAt || 0) : 0;
    const rState = remote && rU > (state.updatedAt || 0) ? await cloudState(remote) : null;
    if (rState){
      state = normalize(rState);
      saveLocal(); render(); setSync('synced');
    } else if ((state.updatedAt || 0) > rU){
      scheduleSave(0);
    } else setSync('synced');
    if (!STANDALONE) buddyStart();
    frStart();
    if (route() === 'prefs' || route() === 'today') render();
    ref.onSnapshot(async s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const d = s.data(); const u = d.updatedAt || 0;
      if (u > (state.updatedAt || 0) && !dirty){
        const rs = await cloudState(d);
        if (rs && u > (state.updatedAt || 0) && !dirty){ state = normalize(rs); saveLocal(); render(); }
      }
    }, () => { cloud.ref = null; setSync('local'); });
  } catch(e){
    clearTimeout(slow); cloud.ref = null; setSync('local');
  }
}

function schedule(st, r){ // r: 0 again, 1 hard, 2 good, 3 easy
  let e = st ? st.e : 2.5, i = st ? st.i : 0, n = st ? st.r : 0;
  if (r === 0){ e = Math.max(1.3, e - 0.2); i = 0; n = 0; }
  else if (n === 0){ i = r === 3 ? 4 : 1; n = 1; if (r === 1) e = Math.max(1.3, e - 0.15); if (r === 3) e += 0.15; }
  else if (r === 1){ e = Math.max(1.3, e - 0.15); i = Math.max(1, Math.round(i * 1.2)); n++; }
  else if (r === 2){ i = Math.max(i + 1, Math.round(i * e)); n++; }
  else { e += 0.15; i = Math.max(i + 2, Math.round(i * e * 1.3)); n++; }
  return { e: +e.toFixed(2), i, r: n, due: addDays(todayStr(), i) };
}

const PRIO_LABEL = {1:'High', 2:'Medium', 3:'Low'};
const prio = x => x.p || 2;
function dueLabel(x){
  if (!x.d) return { text:'No deadline', cls:'' };
  const n = daysBetween(todayStr(), x.d);
  if (x.done) return { text: fmtDate(x.d, {day:'numeric', month:'short'}), cls:'' };
  if (n < 0) return { text:'Overdue by ' + (-n) + (n === -1 ? ' day' : ' days'), cls:'overdue' };
  if (n === 0) return { text:'Due today', cls:'soon' };
  if (n === 1) return { text:'Due tomorrow', cls:'soon' };
  if (n < 7) return { text:'Due ' + fmtDate(x.d, {weekday:'long'}) + ' · ' + n + ' days', cls:'' };
  return { text:'Due ' + fmtDate(x.d, {day:'numeric', month:'short'}) + ' · ' + n + ' days', cls:'' };
}
// Lower score = do it sooner. One priority step is worth about 4 days of deadline.
function urgency(x){ const days = x.d ? daysBetween(todayStr(), x.d) : 14; return (days < 0 ? days - 20 : Math.min(days, 21)) + (prio(x) - 1) * 4; } // overdue always first
function byUrgency(a, b){ return urgency(a) - urgency(b) || prio(a) - prio(b) || (a.d || '9999').localeCompare(b.d || '9999'); }

function viewQuizRun(){

/* ---------- Focus timer ---------- */
const TKEY = 'ial-study-hub-timer';
let T = (() => { try { const t = JSON.parse(localStorage.getItem(TKEY)); if (t && t.phase) return t; } catch(e){} return null; })() || { phase:'focus', running:false, endsAt:0, remain:null };
let audioCtx = null;
function phaseLen(){ return (T.phase === 'focus' ? state.timerPrefs.focus : state.timerPrefs.brk) * 60000; }
function remainMs(){ if (T.remain === null) T.remain = phaseLen(); return T.running ? Math.max(0, T.endsAt - Date.now()) : T.remain; }
function saveT(){ try { localStorage.setItem(TKEY, JSON.stringify(T)); } catch(e){} try { frSchedule(); } catch(e){} }
function fmtClock(ms){ const s = Math.ceil(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function beep(){
  try {
    if (!audioCtx) return;
    [0, 0.35, 0.7].forEach(off => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001, audioCtx.currentTime + off); g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + off + 0.25); o.start(audioCtx.currentTime + off); o.stop(audioCtx.currentTime + off + 0.3); });
  } catch(e){}
}
function timerStart(){
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
  T.endsAt = Date.now() + remainMs(); T.running = true; saveT(); tick(true);
}
function timerPause(){ T.remain = remainMs(); T.running = false; saveT(); tick(true); }
function timerReset(){ T.running = false; T.remain = phaseLen(); saveT(); tick(true); }
function logFocus(minutes){
  if (minutes < 1) return;
  state.sessions.push({ d: todayStr(), m: Math.round(minutes), s: state.timerPrefs.subject });
  if (state.sessions.length > 600) state.sessions = state.sessions.slice(-600);
  commit();
}
function timerStopLog(){
  if (T.phase === 'focus'){ const used = (phaseLen() - remainMs()) / 60000; if (used >= 1){ logFocus(used); toast('Logged ' + Math.round(used) + ' min of focus'); } }
  T.phase = 'focus'; T.running = false; T.remain = phaseLen(); saveT(); render();
}
function timerSkip(){ T.phase = T.phase === 'focus' ? 'break' : 'focus'; T.running = false; T.remain = phaseLen(); saveT(); render(); }
function timerComplete(){
  beep();

    logFocus(state.timerPrefs.focus);
    T.phase = 'break'; toast('Focus block done. Take a ' + state.timerPrefs.brk + '-minute break.');
  } else { T.phase = 'focus'; toast('Break over. Ready for the next block?'); }
  T.running = false; T.remain = phaseLen(); saveT(); render();
}
function tick(force){
  if (T.running && Date.now() >= T.endsAt){ timerComplete(); return; }
  const ms = remainMs();
  const clock = $('#clock'); if (clock) clock.textContent = fmtClock(ms);
  const mini = $('#mini');
  const showMini = route() !== 'planner' && (T.running || (T.remain !== null && T.remain < phaseLen()));

}

function photoFromFile(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Please choose a photo (JPG, PNG or HEIC).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'); c.width = c.height = 160;
        c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 160, 160);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
      } catch(e){ rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That photo couldn’t be opened. Try a JPG or PNG.')); };
    img.src = url;
  });

function scSearch(q){
  if (typeof SCHOOLS === 'undefined') return [];
  const n = scNorm(q); if (n.length < 2) return [];
  const toks = n.split(' ');
  const scored = [];
  SCHOOLS.forEach(x => {
    const hay = scNorm(x[0] + ' ' + x[1] + ' ' + x[2]);
    if (!toks.every(t => hay.includes(t))) return;
    const en = scNorm(x[0]), th = scNorm(x[1]);
    scored.push([en.startsWith(n) || th.startsWith(n) || th.replace(/^โรงเรียน/, '').startsWith(n) ? 0 : 1, x]);
  });
  return scored.sort((a, b) => a[0] - b[0] || a[1][0].length - b[1][0].length || a[1][0].localeCompare(b[1][0])).slice(0, 8).map(a => a[1]);
}
function scRender(){
  const ul = $('#pf-school-list'), inp = $('#pf-school'); if (!ul || !inp) return;
  const q = inp.value.trim();
  if (!SC.hits.length){
    const show = scNorm(q).length >= 2 && typeof SCHOOLS !== 'undefined' && !SCHOOLS.some(x => x[0] === q);
    ul.hidden = !show; inp.setAttribute('aria-expanded', String(show));
    ul.innerHTML = show ? '<li class="scnone">Not in the list? That’s fine: what you type is saved as your school.</li>' : '';
    return;
  }
  ul.hidden = false; inp.setAttribute('aria-expanded', 'true');
  ul.innerHTML = SC.hits.map((x, i) => '<li role="option" id="sc-' + i + '" data-sc="' + i + '" aria-selected="' + (i === SC.idx) + '"><span class="t">' + esc(x[0]) + '</span>' + (x[1] || x[2] ? '<span class="small muted">' + esc([x[1], x[2]].filter(Boolean).join(' · ')) + '</span>' : '') + '</li>').join('');
  if (SC.idx >= 0) inp.setAttribute('aria-activedescendant', 'sc-' + SC.idx); else inp.removeAttribute('aria-activedescendant');
}
function scClose(){ SC.hits = []; SC.idx = -1; const ul = $('#pf-school-list'), inp = $('#pf-school'); if (ul){ ul.hidden = true; ul.innerHTML = ''; } if (inp) inp.setAttribute('aria-expanded', 'false'); }
function scPick(i){ const x = SC.hits[i], inp = $('#pf-school'); if (!x || !inp) return; inp.value = x[0]; scClose(); }
document.addEventListener('input', e => { if (e.target && e.target.id === 'pf-school'){ SC.hits = scSearch(e.target.value); SC.idx = -1; scRender(); } });
document.addEventListener('keydown', e => {
  if (!e.target || e.target.id !== 'pf-school') return;
  const open = SC.hits.length > 0;
  if (e.key === 'ArrowDown' && open){ e.preventDefault(); SC.idx = (SC.idx + 1) % SC.hits.length; scRender(); }
  else if (e.key === 'ArrowUp' && open){ e.preventDefault(); SC.idx = (SC.idx - 1 + SC.hits.length) % SC.hits.length; scRender(); }
  else if (e.key === 'Enter' && open && SC.idx >= 0){ e.preventDefault(); scPick(SC.idx); }
  else if (e.key === 'Escape'){ scClose(); }
});
document.addEventListener('mousedown', e => { const li = e.target.closest && e.target.closest('#pf-school-list [data-sc]'); if (li){ e.preventDefault(); scPick(+li.dataset.sc); } else if (!(e.target.closest && e.target.closest('.schoolpick'))) scClose(); });
document.addEventListener('focusin', e => { if (e.target && e.target.id === 'pf-school') lazy('schools.js', () => { const i = $('#pf-school'); if (i && document.activeElement === i && i.value){ SC.hits = scSearch(i.value); scRender(); } }); });
document.addEventListener('focusout', e => { if (e.target && e.target.id === 'pf-school') setTimeout(scClose, 150); });

/* ============================================================
   Settings: my subjects (add / switch / finish / drop), study habits,
   look & accessibility, reminders, progress summary
   ============================================================ */
const PREF_DEF = { lang:'', theme:'', text:1, motion:false, start:'today', defSubj:'', offDays:[], busy:[], mockKeep:2, remind:'19:00' };
function uiLang(){ const l = prefs().lang; if (l) return l; try { return /^th\b/i.test(navigator.language || '') ? 'th' : 'en'; } catch(e){ return 'en'; } }
function isTH(){ return typeof thApply === 'function' && uiLang() === 'th'; }
function prefs(){ state.prefs = Object.assign({}, PREF_DEF, state.prefs || {}); return state.prefs; }
function subjStatus(sid){ return (state.subjStatus && state.subjStatus[sid]) || 'studying'; }
function iasOnly(sid){ return !!(state.ias && state.ias[sid]); }
function unitStatus(c){ return (state.unitStatus && state.unitStatus[c]) || 'studying'; }
/* takes(): the student is doing this unit (shown in Grades, Settings) */
function takes(c){ const sid = UNIT_SUBJ[c]; return !!sid && !state.hidden.includes(c) && subjStatus(sid) !== 'dropped' && !(iasOnly(sid) && !isASUnit(c)); }
function subjTaken(sid){ return SUBJ[sid].units.some(u => !state.hidden.includes(u.c)); }
/* subjects that appear in the subject chips across the app (studying only) */
function mySubjects(){ const l = SUBJECTS.filter(s => s.units.some(u => !isHidden(u.c))); return l.length ? l : SUBJECTS; }
function gradeSubjects(){ const l = SUBJECTS.filter(s => subjStatus(s.id) !== 'dropped' && s.units.some(u => takes(u.c))); return l.length ? l : SUBJECTS; }
function ensureSubjects(){
  const my = mySubjects().map(s => s.id), gr = gradeSubjects().map(s => s.id), p = prefs();
  const first = my.includes(p.defSubj) ? p.defSubj : my[0];
  if (!ui._subjInit){ ui._subjInit = true; ['quiz', 'papers', 'syllabus'].forEach(k => { ui[k].subj = first; }); if (my.includes(p.defSubj)){ ui.grades.subj = p.defSubj; ui.grades.picked = true; } }
  ['quiz', 'papers', 'syllabus'].forEach(k => { if (!my.includes(ui[k].subj)) ui[k].subj = first; });
  if (ui.cards.subj !== 'all' && !my.includes(ui.cards.subj)) ui.cards.subj = 'all';
  if (ui.mk.subj !== 'all' && !my.includes(ui.mk.subj)) ui.mk.subj = 'all';
  if (!gr.includes(ui.grades.subj)) ui.grades.subj = gr.includes(first) ? first : gr[0];
}
function applyPrefs(){
  const p = prefs(), r = document.documentElement;
  if (p.theme) r.setAttribute('data-theme', p.theme); else r.removeAttribute('data-theme');
  r.style.zoom = p.text && p.text !== 1 ? String(p.text) : '';
  r.classList.toggle('rm', !!p.motion);
}
function mockKeep(){ const k = +prefs().mockKeep; return isNaN(k) ? 2 : Math.max(0, Math.min(4, k)); }

/* ---- unit status / exam series helpers ---- */
const U_STATUS = [['notstarted', 'Not started'], ['studying', 'Studying'], ['sat', 'Sat (done)'], ['resit', 'Resitting']];
function unitSeriesNow(c){
  const e = state.exams.find(x => x.u === c && x.d >= todayStr());
  if (!e) return 'later';
  return TT_SERIES.find(s => ttDate(c, s) && ttDate(c, s)[0] === e.d) || 'keep';
}
function subEditInit(sid, adding){
  const s = SUBJ[sid], taking = {}, st = {}, sr = {};
  s.units.forEach(u => { taking[u.c] = adding ? true : !state.hidden.includes(u.c); st[u.c] = unitStatus(u.c); sr[u.c] = unitSeriesNow(u.c); if (adding && sr[u.c] === 'later'){ const d = (state.setup && state.setup.def) || TT_SERIES[TT_SERIES.length - 1]; if (ttDate(u.c, d)) sr[u.c] = d; } });
  const opt = {}; s.units.forEach(u => { if (u.opts) opt[u.c] = histOpt(u.c); });
  ui.subEdit = { sid, adding: !!adding, taking, st, sr, opt, ias: iasOnly(sid) };
}
function subEditSave(){
  const E = ui.subEdit; if (!E) return; const s = SUBJ[E.sid], t = todayStr();
  state.unitStatus = state.unitStatus || {}; state.ias = state.ias || {}; state.subjStatus = state.subjStatus || {}; state.histOpt = state.histOpt || {};
  let n = 0, dates = 0;
  s.units.forEach(u => {
    const c = u.c, on = E.taking[c] && !(E.ias && !isASUnit(c));
    state.hidden = state.hidden.filter(x => x !== c); if (!on){ state.hidden.push(c); return; }
    n++;
    if (E.st[c] === 'studying') delete state.unitStatus[c]; else state.unitStatus[c] = E.st[c];
    if (u.opts){ if (E.opt[c]) state.histOpt[c] = E.opt[c]; else delete state.histOpt[c]; }
    const sr = E.st[c] === 'sat' ? 'none' : E.sr[c];
    if (sr === 'keep') return;
    state.exams = state.exams.filter(e => !(e.u === c && e.d >= t));
    const d = ttDate(c, sr); if (d){ state.exams.push({ id: uid(), u: c, d: d[0], sess: d[1], src: 'setup' }); dates++; }
  });
  if (E.ias) state.ias[E.sid] = true; else delete state.ias[E.sid];
  if (n && subjStatus(E.sid) === 'dropped') delete state.subjStatus[E.sid];
  if (!n) delete state.subjStatus[E.sid];
  if (!setupDone()) state.setup = Object.assign({ def: TT_SERIES[0] || '', series: {} }, state.setup || {}, { done: true, at: t });
  ui.subEdit = null; commit();
  toast(n ? s.name + ' saved' + (dates ? ' · ' + dates + ' exam date' + (dates === 1 ? '' : 's') : '') : s.name + ' removed from your subjects');
}
function subjSetStatus(sid, v){
  state.subjStatus = state.subjStatus || {};
  if (v === 'studying') delete state.subjStatus[sid]; else state.subjStatus[sid] = v;
  commit();
  toast(v === 'dropped' ? SUBJ[sid].name + ' dropped. Your work on it is kept; restore it any time.' : v === 'finished' ? SUBJ[sid].name + ' marked finished. Its grade stays on the Grades page.' : SUBJ[sid].name + ' is back in your plan.');
}
function subjWipe(sid){
  const codes = new Set(SUBJ[sid].units.map(u => u.c)), inU = k => codes.has(String(k).split('|')[0]);
  Object.keys(state.papers).forEach(k => { if (inU(k)) delete state.papers[k]; });
  codes.forEach(c => { delete state.results[c]; delete (state.unitStatus || {})[c]; delete (state.histOpt || {})[c]; });
  Object.keys(state.topics).forEach(k => { if ([...codes].some(c => k.startsWith(c))) delete state.topics[k]; });
  Object.keys(state.tq || {}).forEach(k => { if ([...codes].some(c => k.startsWith(c))) delete state.tq[k]; });
  state.mistakes = state.mistakes.filter(m => !codes.has(m.u));
  if (state.essays) state.essays = state.essays.filter(e => !codes.has(e.u));
  state.exams = state.exams.filter(e => !codes.has(e.u));
  state.custom = state.custom.filter(k => !codes.has(k.u));
  state.tasks = state.tasks.filter(x => !(x.u && codes.has(x.u)));
  if (state.targets) delete state.targets[sid];
  if (state.subjStatus) delete state.subjStatus[sid];
  if (state.ias) delete state.ias[sid];
  codes.forEach(c => { state.hidden = state.hidden.filter(x => x !== c); state.hidden.push(c); });
  commit(); toast(SUBJ[sid].name + ': all data deleted');
}

/* ---- My subjects card ---- */
function subjSummary(s){
  const units = s.units.filter(u => takes(u.c)), sat = units.filter(u => unitStatus(u.c) === 'sat').length, rs = units.filter(u => unitStatus(u.c) === 'resit').length;
  const nx = units.map(u => state.exams.find(e => e.u === u.c && e.d >= todayStr())).filter(Boolean).sort((a, b) => a.d.localeCompare(b.d))[0];
  const bits = [units.length + ' unit' + (units.length === 1 ? '' : 's') + (iasOnly(s.id) ? ' · IAS only' : '')];
  if (sat) bits.push(sat + ' sat'); if (rs) bits.push(rs + ' resit' + (rs === 1 ? '' : 's'));
  if (targetFor(s.id)) bits.push('target ' + targetFor(s.id));
  if (nx) bits.push('next exam ' + fmtDate(nx.d, {day:'numeric', month:'short'}));
  const ho = s.units.filter(u => u.opts && takes(u.c) && histOpt(u.c)).map(u => histOpt(u.c));
  if (ho.length) bits.push('options ' + ho.join(', '));
  return bits.join(' · ');
}

    '<div class="row" style="gap:6px;flex-wrap:nowrap">' + (st === 'dropped'
      ? '<button class="btn sm" data-act="sub-status" data-sid="' + s.id + '" data-v="studying">Restore</button><button class="btn sm danger" data-act="sub-wipe" data-v="' + s.id + '">' + (c === 'wipe-' + s.id ? 'Tap again: delete for good' : 'Delete data') + '</button>'
      : statusSel + '<button class="btn sm" data-act="sub-edit" data-v="' + s.id + '">Edit</button>') + '</div></div>';
}

/* ---------- Reminders by notification ----------
   Made on this device only: nothing is sent to a server, and no one else can see them.
   The page writes a small list of upcoming reminders; the page and the service worker both show the ones that are due. */
const NOTIF_API = STANDALONE && typeof Notification !== 'undefined' && 'serviceWorker' in navigator && 'caches' in window && location.protocol.startsWith('http');
const NOTIF = { bg: null };
function notifPrefs(){ const p = prefs(); if (!p.notif || typeof p.notif !== 'object') p.notif = { on: false, exam: true, reg: true, daily: true }; return p.notif; }
function notifOn(){ return NOTIF_API && notifPrefs().on && Notification.permission === 'granted'; }
function notifTr(s){ try { return (typeof isTH === 'function' && isTH() && thText(s)) || s; } catch(e){ return s; } }
function notifPlan(){
  const n = notifPrefs(), out = [], t = todayStr();
  const at = (d, hm) => { const x = parseD(d), a = hm.split(':'); x.setHours(+a[0], +a[1], 0, 0); return x.getTime(); };
  const add = (id, when, title, body, url) => out.push({ id, at: when, title: notifTr(title), body: notifTr(body), url: url || '#today' });
  if (n.exam){
    const days = [...new Set(state.exams.filter(e => e.d >= t && e.d <= addDays(t, 120) && (!UNIT[e.u] || !isHidden(e.u))).map(e => e.d))];
    days.forEach(d => {
      const list = examsOn(d), names = list.map(e => edName(e.u)).join(' and '), am = list.some(e => e.sess !== 'PM');
      add('ex1|' + d, at(addDays(d, -1), '17:00'), 'Exam tomorrow', names + '. Pack your bag tonight and get a proper night’s sleep.');
      add('ex0|' + d, at(d, am ? '06:30' : '10:30'), 'Exam today', names + '. Take your statement of entry and photo ID. Good luck!');
    });
  }
  if (n.reg) regSeries().filter(x => x.mine && !x.done && x.dl >= t).forEach(x => [7, 3, 1, 0].forEach(k => {
    const d = addDays(x.dl, -k); if (d < t) return;
    add('reg|' + x.sr + '|' + k, at(d, '09:00'), k ? 'Exam registration closes in ' + k + ' day' + (k === 1 ? '' : 's') : 'Exam registration closes today', x.sr + ' exams. Ask your school or exam centre. Late fees start after the deadline.', '#planner');
  }));
  if (n.daily){
    const p = prefs(), hm = p.remind || '19:00';
    for (let i = 0; i < 7; i++){
      const d = addDays(t, i);
      if (p.offDays.includes(parseD(d).getDay()) || (p.busy || []).includes(d)) continue;
      if (i === 0 && studyMinutes(d) >= goalMin()) continue;
      add('day|' + d, at(d, hm), 'Time to study', 'You haven’t reached today’s goal yet. Open IAL Revise to see what to do next.');
    }
  }
  return out.sort((a, b) => a.at - b.at);
}
async function notifStore(key, val){
  const c = await caches.open('ial-notif');
  if (val === undefined){ const r = await c.match('./__notif/' + key); return r ? r.json() : null; }
  await c.put('./__notif/' + key, new Response(JSON.stringify(val), { headers: { 'Content-Type': 'application/json' } }));
}
let notifTimer = null;
function notifSchedule(){ if (!NOTIF_API) return; clearTimeout(notifTimer); notifTimer = setTimeout(notifSync, 1500); }
async function notifSync(){
  if (!NOTIF_API) return;
  try {
    if (!notifOn()){ await notifStore('plan', []); return; }
    const plan = notifPlan(); await notifStore('plan', plan);
    const sent = (await notifStore('sent')) || {}, now = Date.now(); let changed = false;
    const reg = await navigator.serviceWorker.ready;
    for (const x of plan){
      if (x.at > now || now - x.at > 12 * 3600e3 || sent[x.id]) continue;
      sent[x.id] = now; changed = true;
      if (x.id.indexOf('day|') === 0 && document.visibilityState === 'visible') continue;   // they're already here
      await reg.showNotification(x.title, { body: x.body, tag: x.id, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: { url: x.url } });
    }
    if (changed){ Object.keys(sent).forEach(k => { if (now - sent[k] > 45 * 86400e3) delete sent[k]; }); await notifStore('sent', sent); }
  } catch(e){}
}
async function notifBackground(){
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!('periodicSync' in reg)) return false;
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (st.state !== 'granted') return false;
    await reg.periodicSync.register('ial-remind', { minInterval: 4 * 3600e3 });
    return true;
  } catch(e){ return false; }
}
async function notifEnable(){
  if (!NOTIF_API) return;
  let perm = Notification.permission;
  if (perm === 'default') try { perm = await Notification.requestPermission(); } catch(e){}
  if (perm !== 'granted'){ toast('Notifications are blocked for this site. Allow them in your browser’s site settings, then try again.'); render(); return; }
  notifPrefs().on = true; NOTIF.bg = await notifBackground(); commit(); notifSync(); toast('Reminders are on.');
}
async function notifTest(){

  catch(e){ toast('Couldn’t show a notification on this device.'); }
}

    (on ? '<div class="stack" style="gap:6px">' + box('exam', 'Exam tomorrow and exam today') + box('reg', 'Exam registration closing (7, 3 and 1 days before)') + box('daily', 'Daily goal not reached, at ' + esc(prefs().remind || '19:00')) + '</div>' +

/* ---------- Marks to win back: which topics cost a grade, from the mistake log ---------- */
function topicGains(c){
  const ms = state.mistakes.filter(m => m.u === c && !m.fixed && m.t !== null && m.t !== undefined && m.lost > 0 && !/^UK /.test(m.sr || ''));
  if (!ms.length || !UNIT[c]) return null;
  const papers = new Set(ms.map(m => m.sr).filter(Boolean)).size, n = Math.max(1, papers), by = {};
  ms.forEach(m => { by[m.t] = (by[m.t] || 0) + m.lost; });
  const top = Object.entries(by).map(([t, lost]) => ({ t: +t, lost, per: lost / n })).filter(x => UNIT[c].t[x.t]).sort((a, b) => b.lost - a.lost).slice(0, 3);
  if (!top.length) return null;
  const gain = Math.max(1, Math.round(top.reduce((a, x) => a + x.per, 0))), max = PAPER_MAX[c];
  const recs = Object.entries(state.papers).filter(([k]) => k.indexOf(c + '|') === 0).map(([k, r]) => ({ sr: k.slice(c.length + 1), r })).sort((a, b) => (a.r.d || '').localeCompare(b.r.d || '')).slice(-3);
  let now = null, then = null;
  if (max && recs.length){
    const raw = Math.round(recs.reduce((a, x) => a + x.r.s / x.r.m * max, 0) / recs.length), sr = recs[recs.length - 1].sr, up = Math.min(max, raw + gain);
    const a = rawToUms(c, sr, raw), b = rawToUms(c, sr, up);
    if (a && b){ now = { raw, g: unitGrade(c, a.ums) }; then = { raw: up, g: unitGrade(c, b.ums) }; }
  }
  return { c, n, papers, top, gain, now, then, max };
}

      x.top.map(w => { const per = Math.round(w.per * 10) / 10; return '<div class="li mktopic"><div class="grow"><div class="t">' + esc(u.t[w.t]) + '</div><div class="small muted">' + w.lost + ' mark' + (w.lost === 1 ? '' : 's') + ' lost' + (x.papers > 1 ? ' over ' + x.papers + ' papers' : '') + '</div></div><span class="muted small">−' + per + ' a paper</span>' +

/* ---- Progress summary for a teacher or counsellor ---- */
function summaryData(){
  const saved = ui.grades.whatif; ui.grades.whatif = {};
  const out = SUBJECTS.filter(s => subjStatus(s.id) !== 'dropped' && s.units.some(u => takes(u.c)) && (setupDone() || s.units.some(u => (state.results[u.c] || []).length || Object.keys(state.papers).some(k => k.startsWith(u.c + '|'))))).map(s => {
    let grade = null;
    if (s.id === 'math' || s.id === 'fm'){ const a = mathAward(), q = s.id === 'math' ? (a.m || a.asM) : (a.f || a.asF); if (q) grade = { g: q.grade, t: q.total, max: q.max, proj: false }; }
    else { const a = sciAward(s.id); if (iasOnly(s.id) && a.as) grade = { g: a.as.grade, t: a.as.total, max: a.as.max, proj: false }; else if (a.grade) grade = { g: a.grade, t: a.total, max: a.max, proj: !a.complete }; }
    const units = s.units.filter(u => takes(u.c)).map(u => {
      const recs = Object.entries(state.papers).filter(([k]) => k.startsWith(u.c + '|')).map(([, r]) => r);
      const avg = recs.length ? Math.round(recs.reduce((a, r) => a + paperPct(r), 0) / recs.length * 100) : null;
      const v = unitValue(u.c), ex = state.exams.find(e => e.u === u.c && e.d >= todayStr());
      const weak = u.t.map((n, i) => ({ n, lost: topicMistakes(u.c, i).reduce((a, m) => a + m.lost, 0), st: state.topics[topicId(u.c, i)] || 0 })).filter(x => x.lost > 0 || x.st === 1).sort((a, b) => b.lost - a.lost).slice(0, 3).map(x => x.n);
      return { c: u.c, l: u.l, n: u.n, st: unitStatus(u.c), ums: v ? v.ums : null, umsSrc: v ? v.src : null, max: umsMax(u.c), papers: recs.length, avg, exam: ex ? ex.d : null, weak, opt: u.opts ? histOpt(u.c) : '' };
    });
    return { s, status: subjStatus(s.id), target: targetFor(s.id), grade, units, open: state.mistakes.filter(m => !m.fixed && UNIT_SUBJ[m.u] === s.id).length };
  });
  ui.grades.whatif = saved; return out;
}

/* ============================================================

   Sciences: A* = A overall + ≥ 90% of the IA2 (Units 4–6) UMS.

const GBS = typeof GB !== 'undefined' ? GB : {};

const PAPER_MIN = {};
SUBJECTS.forEach(s => s.units.forEach(u => { const n = +u.c.slice(-1); PAPER_MIN[u.c] = (s.id === 'math' || s.id === 'fm') ? 90 : (n === 3 || n === 6) ? 80 : (n === 4 || n === 5) ? 105 : 90; }));
/* 4-unit subjects: exam length (min) and maximum UMS, from the Pearson specifications */
const UNIT4_INFO = { WHI01:[120,100], WHI02:[120,100], WHI03:[120,100], WHI04:[120,100], WEC11:[105,100], WEC12:[105,100], WEC13:[120,100], WEC14:[120,100], WGE01:[105,120], WGE02:[90,80], WGE03:[120,120], WGE04:[90,80], WPS01:[90,80], WPS02:[120,120], WPS03:[90,80], WPS04:[120,120], WCP01:[90,100], WCP02:[180,100], WCP03:[90,100], WCP04:[180,100], WAC11:[180,300], WAC12:[180,300], WAA01:[150,100], WAA02:[180,100], WGK01:[150,100], WGK02:[180,100], WBS11:[120,100], WBS12:[120,100], WBS13:[120,100], WBS14:[120,100], WEN01:[105,100], WEN02:[105,100], WEN03:[120,100], WEN04:[120,100], WET01:[120,100], WET02:[120,100], WET03:[120,100], WET04:[120,100], WIT11:[120,100], WIT12:[180,100], WIT13:[120,100], WIT14:[180,100], YLA11:[180,100], YLA12:[180,100], WFR01:[10,60], WFR02:[150,140], WFR03:[13,60], WFR04:[150,140], WGN01:[10,60], WGN02:[150,140], WGN03:[13,60], WGN04:[150,140], WSP01:[10,60], WSP02:[150,140], WSP03:[13,60], WSP04:[150,140] };
Object.entries(UNIT4_INFO).forEach(([c, [m]]) => { PAPER_MIN[c] = m; });
function isMathsUnit(c){ return UNIT_SUBJ[c] === 'math' || UNIT_SUBJ[c] === 'fm'; }
function umsMax(c){ if (isMathsUnit(c)) return 100; if (UNIT4_INFO[c]) return UNIT4_INFO[c][1]; const n = +c.slice(-1); return (n === 3 || n === 6) ? 60 : 120; }
function fmtDur(m){ return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); }
function boundsFor(c, sr){
  const mo = String(sr).match(/^(.*) · (\w+)$/); if (mo){ c = c + '_' + mo[2]; sr = mo[1]; }

/* Raw marks needed for each grade on one paper, from that series' boundaries */
function gradeTargets(c, sr){

}
function paperTargets(c, sr){
  const g = gradeTargets(c, sr); if (!g) return '';

    g.list.map(([gr, r]) => '<span class="tg' + (gr === want ? ' on' : '') + '"><b>' + gr + '</b> ' + r + '</span>').join('') + '<span class="muted">/ ' + g.max + '</span></div>';

function rawToUms(c, sr, raw){

function gradePill(g){ const i = gIdx(g); const c = i >= 5 ? 'good' : i >= 3 ? 'hi' : 'bad'; return '<span class="pill gp" style="background:color-mix(in srgb,var(--' + c + ') 20%,transparent)">' + esc(g) + '</span>'; }
const sum = (cs, vals) => cs.reduce((a, c) => a + vals[c], 0);
function choose(arr, k){ const out = []; (function go(i, cur){ if (cur.length === k){ out.push(cur.slice()); return; } for (let j = i; j < arr.length; j++){ cur.push(arr[j]); go(j + 1, cur); cur.pop(); } })(0, []); return out; }

/* A paper's UMS (raw marks scaled to the full paper if logged out of a different total) */
function paperUms(c, sr, rec){ const max = PAPER_MAX[c]; if (!rec || !max) return null; const raw = rec.m === max ? rec.s : Math.round(rec.s / rec.m * max); return rawToUms(c, sr, raw); }
function mockEst(c){
  const recs = Object.entries(state.papers).filter(([k]) => k.startsWith(c + '|')).map(([k, r]) => ({ sr: k.slice(c.length + 1), r }))
    .sort((a, b) => (a.r.d || '').localeCompare(b.r.d || '')).slice(-3);
  const v = recs.map(x => paperUms(c, x.sr, x.r)).filter(Boolean).map(x => x.ums);

function bestResult(c){ const rs = state.results[c] || []; return rs.length ? rs.reduce((a, b) => b.ums > a.ums ? b : a) : null; }
function unitValue(c){
  if (ui.grades.whatif[c] !== undefined) return { ums: ui.grades.whatif[c], src: 'whatif' };

function valsFor(codes){ const v = {}; codes.forEach(c => { const x = unitValue(c); if (x) v[c] = x.ums; }); return v; }

/* ---------- Sciences (6 units) and 4-unit subjects: one fixed qualification ---------- */
function sciAward(sid){
  const codes = SUBJ[sid].units.map(u => u.c), vals = valsFor(codes), half = codes.length / 2;
  const have = codes.filter(c => vals[c] !== undefined), max = codes.reduce((a, c) => a + umsMax(c), 0);
  const a2 = codes.slice(half), a2max = a2.reduce((a, c) => a + umsMax(c), 0);

  const asC = codes.slice(0, half), asMax = max - a2max;
  if (asC.every(c => vals[c] !== undefined)) res.as = { total: sum(asC, vals), max: asMax, grade: qualGrade(sum(asC, vals), asMax) };
  if (!have.length) return res;
  const got = sum(have, vals), gotMax = have.reduce((a, c) => a + umsMax(c), 0);

  const a2tot = a2.reduce((a, c) => a + (vals[c] !== undefined ? vals[c] : (got / gotMax) * umsMax(c)), 0);

/* ---------- Maths / Further Maths: best legal combination of units ---------- */
function better(a, b){ for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; }
const P_UNITS = ['WMA11','WMA12','WMA13','WMA14'];
const MATH_PAIRS = [['WME01','WST01'],['WME01','WDM11'],['WME01','WME02'],['WST01','WDM11'],['WST01','WST02']];
const FM_POOL = ['WFM02','WFM03','WME01','WME02','WME03','WST01','WST02','WST03','WDM11'];
function mathAward(){
  const vals = valsFor(SUBJ.math.units.concat(SUBJ.fm.units).map(u => u.c)), has = c => vals[c] !== undefined;
  const mathOpts = P_UNITS.every(has) ? MATH_PAIRS.filter(p => p.every(has)).map(p => P_UNITS.concat(p)) : [];
  let best = null;
  for (const mu of (mathOpts.length ? mathOpts : [null])){
    let m = null;
    if (mu){ const t = sum(mu, vals), p34 = vals.WMA13 + vals.WMA14; let g = qualGrade(t, 600); if (g === 'A' && p34 >= 180) g = 'A*'; m = { units: mu, total: t, max: 600, grade: g, a2: p34, a2need: 180, a2codes: ['WMA13','WMA14'] }; }

      const rest = FM_POOL.filter(c => has(c) && !(mu || []).includes(c));
      choose(rest, 5).forEach(cb => {
        if (!cb.includes('WFM02') && !cb.includes('WFM03')) return;
        const units = ['WFM01'].concat(cb), t = sum(units, vals);
        const a2u = units.filter(c => A2.has(c)).sort((x, y) => vals[y] - vals[x]).slice(0, 3), a2 = sum(a2u, vals);
        let g = qualGrade(t, 600); if (g === 'A' && a2u.length === 3 && a2 >= 270) g = 'A*';
        if (!f || gIdx(g) > gIdx(f.grade) || (g === f.grade && t > f.total)) f = { units, total: t, max: 600, grade: g, a2, a2need: 270, a2codes: a2u };
      });
    }
    const score = [m ? gIdx(m.grade) : -1, f ? gIdx(f.grade) : -1, f ? f.total : 0, m ? -m.total : 0];
    if (!best || better(score, best.score)) best = { m, f, score };

/* ---------- Resit planner: where the next marks are cheapest ---------- */
function resitIdeas(codes, vals){

/* ---- study time (focus timer + timed papers + planner steps) ---- */
function studyMinutes(d){
  let m = minutesOn(d);
  Object.values(state.papers).forEach(r => { if (r.d === d && r.min) m += r.min; });
  Object.values(state.oldDone).forEach(r => { if (r && typeof r === 'object' && r.d === d && r.min) m += r.min; });
  return m;
}
function goalMin(){ return (state.goal && state.goal.min) || 60; }
function goalStreak(){
  let d = todayStr(), n = 0;
  if (studyMinutes(d) < goalMin()) d = addDays(d, -1);
  while (studyMinutes(d) >= goalMin() && n < 999){ n++; d = addDays(d, -1); }
  return n;
}
function goalRing(){
  const m = studyMinutes(todayStr()), g = goalMin(), pc = Math.min(1, m / g), r = 26, C = 2 * Math.PI * r;
  const done = m >= g, st = goalStreak();
  return '<div class="goal' + (done ? ' met' : '') + '"><button class="ringbtn" data-act="goal-edit" aria-label="Daily goal: ' + Math.round(m) + ' of ' + g + ' minutes. Tap to change.">' +
    '<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="7"/><circle cx="32" cy="32" r="' + r + '" fill="none" stroke="' + (done ? 'var(--good)' : 'var(--hi)') + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C * pc).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 32 32)"/></svg>' +
    '<span class="ringtxt">' + (done ? '✓' : Math.round(pc * 100) + '%') + '</span></button>' +
    '<div class="goaltxt"><b>' + fmtMin(m) + '</b> <span class="muted">/ ' + fmtMin(g) + ' today</span><div class="small muted">' + (st ? '🔥 ' + st + '-day goal streak' : done ? 'Goal met. Streak starts today!' : 'Hit your goal to start a streak') + '</div></div>' +
    (ui.goalEdit ? '<div class="goaledit"><span class="small muted">Daily goal</span>' + [30, 45, 60, 90, 120, 180].map(x => '<button class="chip" data-act="goal-set" data-v="' + x + '" aria-pressed="' + (x === g) + '">' + fmtMin(x) + '</button>').join('') + '</div>' : '') +
  '</div>';
}

/* ---- all exams timeline ---- */
function readiness(c){
  const u = UNIT[c]; if (!u) return 0;
  const topics = unitProgress(u);
  const recs = Object.entries(state.papers).filter(([k]) => k.startsWith(c + '|')).map(([, r]) => r).sort((a, b) => (a.d || '').localeCompare(b.d || '')).slice(-3);
  const papers = recs.length ? recs.reduce((a, r) => a + paperPct(r), 0) / recs.length : null;
  return papers === null ? topics : topics * 0.5 + papers * 0.5;
}
function examsTimeline(){
  const t = todayStr(), ex = upcomingExams().filter(e => UNIT[e.u] && !isHidden(e.u));
  if (ex.length < 2) return '';
  return '<div class="card"><div class="card-h"><h2>All exams</h2><a class="small muted" href="#setup" data-act="su-open">Edit</a></div><div class="xtl" role="list">' + ex.map(e => {
    const u = UNIT[e.u], n = daysBetween(t, e.d), r = readiness(e.u), col = r >= .7 ? 'good' : r >= .4 ? 'warn' : 'bad', sid = UNIT_SUBJ[e.u];
    return '<a class="xt" role="listitem" href="#syllabus" data-act="goto-rev" data-u="' + e.u + '" style="--c:var(--' + sid + ')" title="' + esc(u.l + ' ' + u.n) + ': ' + Math.round(r * 100) + '% ready">' +
      '<span class="xd">' + (n === 0 ? 'Today' : n + 'd') + '</span><b>' + esc(u.l) + '</b><span class="small muted">' + esc(SUBJ[sid].short) + '</span>' +
      '<span class="small muted">' + fmtDate(e.d, {day:'numeric', month:'short'}) + (e.sess ? ' · ' + e.sess : '') + '</span>' +
      '<span class="xr"><i style="width:' + Math.round(r * 100) + '%;background:var(--' + col + ')"></i></span><span class="small">' + Math.round(r * 100) + '% ready</span></a>';
  }).join('') + '</div><p class="small muted" style="margin:8px 0 0">Ready = topic progress, plus your last 3 paper scores once you’ve logged some.</p></div>';
}

/* ---- session planner ---- */
/* "Just 15 minutes": one focused task, the most useful thing that fits */
function plan15(){
  const ex = upcomingExams().filter(e => UNIT[e.u] && !isHidden(e.u)), c0 = ex.length ? ex[0].u : (visibleUnits('all')[0] || {}).c;
  const dm = dueMistakes().length, dd = decksIn('all').filter(d => deckStatus(d) === 'due').length, dk = allCards().filter(c => cardStatus(c) === 'due').length;
  const one = (kind, title, act, s) => [{ id: uid(), kind, title, min: 15, act, s: s || '', done: false }];
  if (dm) return one('mistakes', 'Redo ' + Math.min(dm, 5) + ' mistake' + (Math.min(dm, 5) === 1 ? '' : 's') + ' from your log', 'mk-review');
  if (dd || dk) return one('cards', 'Flashcards: ' + (dd ? dd + ' deck' + (dd === 1 ? '' : 's') : dk + ' card' + (dk === 1 ? '' : 's')) + ' due', 'cards');
  if (c0){ const w = weakestTopic(c0); if (w) return pmtPacks(c0, w.i).length ? one('questions', 'Topic questions: ' + w.name + ' (' + UNIT[c0].l + ')', 'tq:' + c0, UNIT_SUBJ[c0]) : one('notes', 'Read notes: ' + w.name + ' (' + UNIT[c0].l + ')', 'rev:' + c0, UNIT_SUBJ[c0]); }
  return one('cards', 'Flashcards: quick review', 'cards');
}
function planFor(total){
  if (total <= 15) return plan15();
  const steps = [], t = todayStr(); let left = total;
  const push = (kind, title, min, act, s) => { if (left <= 0 || min < 5) return; const m = Math.min(min, left); if (m < 10 && kind !== 'mistakes' && kind !== 'cards') return; steps.push({ id: uid(), kind, title, min: m, act, s: s || '', done: false }); left -= m; };
  const ex = upcomingExams().filter(e => UNIT[e.u] && !isHidden(e.u));
  const focus = ex.length ? ex.slice(0, 2).map(e => e.u) : visibleUnits('all').slice(0, 2).map(u => u.c);
  const dm = dueMistakes().length;
  if (dm) push('mistakes', 'Review ' + dm + ' mistake' + (dm === 1 ? '' : 's'), Math.min(20, Math.max(5, dm * 3)), 'mk-review');
  const dd = decksIn('all').filter(d => deckStatus(d) === 'due').length;
  if (dd) push('cards', 'Flashcards: ' + dd + ' deck' + (dd === 1 ? '' : 's') + ' due', Math.min(15, 5 + dd * 2), 'cards');
  const c0 = focus[0];
  if (c0){
    const p = pickPaper(c0, ex[0] ? daysBetween(t, ex[0].d) : null), pm = PAPER_MIN[c0] || 90;
    if (left >= pm + 10 && p) push('mock', 'Timed mock: ' + UNIT[c0].l + ' ' + p.sr, pm, 'mock:' + paperKey(c0, p.sr), UNIT_SUBJ[c0]);
    const w = weakestTopic(c0);
    if (w){ push('notes', 'Revise ' + w.name + ' (' + UNIT[c0].l + ')', 20, 'rev:' + c0, UNIT_SUBJ[c0]); if (pmtPacks(c0, w.i).length) push('questions', 'Topic questions: ' + w.name, 25, 'tq:' + c0, UNIT_SUBJ[c0]); }
  }
  const c1 = focus[1];
  if (c1 && left >= 20){ const w = weakestTopic(c1); if (w) push('notes', 'Revise ' + w.name + ' (' + UNIT[c1].l + ')', Math.min(30, left), 'rev:' + c1, UNIT_SUBJ[c1]); }
  if (left >= 10 && c0) push('questions', 'More ' + UNIT[c0].l + ' topic questions', left, 'tq:' + c0, UNIT_SUBJ[c0]);
  // breaks every ~50 minutes of work
  const out = []; let run = 0;
  steps.forEach((s, i) => { if (run >= 45 && s.kind !== 'mock'){ out.push({ id: uid(), kind: 'break', title: 'Break: stand up, water, no phone', min: 5, act: '', done: false }); run = 0; } out.push(s); run += s.min; });
  return out;
}
function planCard(){
  const pl = state.plan && state.plan.d === todayStr() ? state.plan : null;
  if (!pl){
    return '<div class="card plancard"><div class="card-h"><h2>Plan my session</h2></div><p class="small muted" style="margin:0 0 8px">How long have you got? You’ll get a step-by-step plan built from your exams, mistakes and weak topics.</p><div class="chips">' +
      [15, 30, 60, 90, 120, 180].map(m => '<button class="chip' + (m === 15 ? ' quick15' : '') + '" data-act="plan-make" data-v="' + m + '">' + (m === 15 ? '⚡ Just 15 min' : fmtMin(m)) + '</button>').join('') + '</div></div>';
  }
  const done = pl.steps.filter(s => s.done).length, mins = pl.steps.filter(s => s.done).reduce((a, s) => a + s.min, 0);
  const next = pl.steps.find(s => !s.done);
  return '<div class="card plancard"><div class="card-h"><h2>Today’s session · ' + fmtMin(pl.total) + '</h2><button class="linkbtn small" data-act="plan-clear">New plan</button></div>' +
    '<div class="pbar"><i style="width:' + Math.round(done / pl.steps.length * 100) + '%"></i></div><p class="small muted" style="margin:6px 0 4px">' + done + ' of ' + pl.steps.length + ' steps · ' + fmtMin(mins) + ' done</p>' +
    '<ol class="steps">' + pl.steps.map(s => '<li class="' + (s.done ? 'done' : s === next ? 'cur' : '') + '"><button class="check" role="checkbox" aria-checked="' + s.done + '" data-act="plan-done" data-id="' + s.id + '" aria-label="Mark step done">' + (s.done ? '✓' : '') + '</button>' +
      '<div class="grow"><div class="t">' + esc(s.title) + '</div><div class="small muted">' + s.min + ' min</div></div>' + (s.act && !s.done ? '<button class="btn sm' + (s === next ? ' primary' : '') + '" data-act="plan-go" data-id="' + s.id + '">Start</button>' : '') + '</li>').join('') + '</ol>' +
    (!next ? '<p class="tline ok" style="margin-top:8px"><b>Session complete.</b> Nice work: ' + fmtMin(mins) + ' logged.</p>' : '') + '</div>';
}
function planGo(s){
  const a = s.act || '';
  if (a === 'mk-review'){ const q = dueMistakes(); if (q.length){ ui.mk.review = { queue: shuffle(q.map(m => m.id)), idx: 0, shown: false, done: 0 }; ui.mk.form = null; } go('mistakes'); }
  else if (a === 'cards') go('cards');
  else if (a.startsWith('mock:')){ const key = a.slice(5), mi = mockInfo(key); mockStart(key); if (mi.qp) window.open(mi.qp, '_blank', 'noopener'); render(); toast('Timer started: ' + fmtDur(mi.min) + '.'); }
  else if (a.startsWith('rev:')){ const c = a.slice(4); ui.syllabus.subj = UNIT_SUBJ[c]; ui.syllabus.open = c; go('syllabus'); }
  else if (a.startsWith('tq:')){ const c = a.slice(3); ui.quiz.subj = UNIT_SUBJ[c]; ui.quiz.unit = c; go('quiz'); }
}

/* ---- weekly review ---- */
function weekStats(end){
  const days = [...Array(7)].map((_, i) => addDays(end, -i)), inW = d => d && days.includes(d);
  const mins = days.reduce((a, d) => a + studyMinutes(d), 0);
  const papers = Object.values(state.papers).filter(r => inW(r.d)).concat(Object.values(state.oldDone).filter(r => r && typeof r === 'object' && inW(r.d) && r.m));
  const avg = papers.length ? Math.round(papers.reduce((a, r) => a + r.s / r.m, 0) / papers.length * 100) : null;
  const mkNew = state.mistakes.filter(m => inW(m.d)), mkFixed = state.mistakes.filter(m => m.fixed && inW(m.fixedAt));
  const topicsUp = Object.entries(state.topicAt || {}).filter(([, d]) => inW(d)).length;
  const reviews = days.reduce((a, d) => a + (state.reviewDays[d] || 0), 0);
  const goalDays = days.filter(d => studyMinutes(d) >= goalMin()).length;
  return { mins, papers: papers.length, avg, mkNew: mkNew.length, lost: mkNew.reduce((a, m) => a + m.lost, 0), mkFixed: mkFixed.length, topicsUp, reviews, goalDays };
}
function focusPoints(){
  const pts = [];
  const open = mistakesIn('all').filter(m => !m.fixed), by = {};
  open.forEach(m => by[m.why] = (by[m.why] || 0) + m.lost);
  const top = Object.keys(by).sort((a, b) => by[b] - by[a])[0];
  if (top && WHY[top]) pts.push('<b>Fix your biggest leak (' + esc(WHY[top].l.toLowerCase()) + ', ' + by[top] + ' marks):</b> ' + esc(WHY[top].fix));
  const ex = upcomingExams().filter(e => UNIT[e.u] && !isHidden(e.u));
  if (ex[0]){ const w = weakestTopic(ex[0].u); if (w) pts.push('<b>Revise ' + esc(w.name) + '</b> for ' + esc(UNIT[ex[0].u].l) + ' (exam in ' + daysBetween(todayStr(), ex[0].d) + ' days).'); }
  const gaps = targetGaps(); if (gaps[0]) pts.push('<b>' + esc(gaps[0].n) + ' is below your target ' + esc(gaps[0].tg) + '.</b> Check Grades for the units that would gain the most.');
  if (ex[0] && pts.length < 3 && daysBetween(todayStr(), ex[0].d) <= 56){ const last = lastPaperDate(ex[0].u); if (!last || daysBetween(last, todayStr()) > 7) pts.push('<b>Sit a timed mock</b> for ' + esc(UNIT[ex[0].u].l) + '. ' + (last ? 'Your last one was ' + daysBetween(last, todayStr()) + ' days ago.' : 'You haven’t done one yet.')); }
  if (pts.length < 3) pts.push('<b>Keep your goal streak going:</b> ' + fmtMin(goalMin()) + ' a day adds up to ' + fmtMin(goalMin() * 7) + ' a week.');
  return pts.slice(0, 3);
}
function weekId(d){ const dt = new Date(d + 'T00:00:00'); const day = (dt.getDay() + 6) % 7; return addDays(d, -day); } // Monday of that week
function reviewCard(force){
  const t = todayStr(), isSun = new Date(t + 'T00:00:00').getDay() === 0, wk = weekId(t);
  if (!force && !(isSun && state.reviewSeen !== wk)) return '';
  const a = weekStats(t), b = weekStats(addDays(t, -7));
  if (!force && !a.mins && !a.papers && !a.reviews && !a.mkNew && !b.mins && !b.papers) return '';
  if (!force) return '<div class="card weekly-mini row" style="justify-content:space-between;align-items:center;gap:10px"><div><b>Your week:</b> ' + fmtMin(a.mins) + ' studied · ' + a.goalDays + '/7 goal days · ' + a.papers + ' paper' + (a.papers === 1 ? '' : 's') + '</div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-act="review-open">Full review</button><button class="linkbtn small" data-act="review-seen">Hide</button></div></div>';
  const delta = (x, y, unit) => { if (y === null || y === undefined || x === null) return ''; const d = x - y; return d === 0 ? '' : ' <span class="small ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(d)) + (unit || '') + '</span>'; };
  const cell = (v, l, extra) => '<div class="wr"><b>' + v + '</b>' + (extra || '') + '<span>' + l + '</span></div>';
  return '<div class="card weekly"><div class="card-h"><h2>Weekly review</h2>' + (force ? '<button class="linkbtn small" data-act="review-close">Close</button>' : '<button class="linkbtn small" data-act="review-seen">Done</button>') + '</div>' +
    '<p class="small muted" style="margin:0 0 10px">' + fmtDate(addDays(t, -6), {day:'numeric', month:'short'}) + ' to ' + fmtDate(t, {day:'numeric', month:'short'}) + ', compared with the week before.</p>' +
    '<div class="wrgrid">' + cell(fmtMin(a.mins), 'studied', delta(a.mins, b.mins, 'm')) + cell(a.goalDays + '/7', 'goal days', delta(a.goalDays, b.goalDays)) + cell(a.papers, 'papers done', delta(a.papers, b.papers)) + cell(a.avg === null ? '–' : a.avg + '%', 'paper average', a.avg !== null && b.avg !== null ? delta(a.avg, b.avg, '%') : '') +
      cell(a.mkNew, 'mistakes logged') + cell(a.mkFixed, 'mistakes fixed', delta(a.mkFixed, b.mkFixed)) + cell(a.topicsUp, 'topics moved up') + cell(a.reviews, 'reviews done', delta(a.reviews, b.reviews)) + '</div>' +
    '<div class="plan-box" style="margin-top:12px"><div class="small muted" style="font-weight:600;letter-spacing:.02em">FOCUS NEXT WEEK</div><ol class="fp">' + focusPoints().map(x => '<li>' + x + '</li>').join('') + '</ol></div></div>';
}

/* ---- core practicals ---- */
function cpKey(sid, n){ return sid + '-' + n; }
function cpList(sid){ return (typeof CORE_PRACTICALS !== 'undefined' && CORE_PRACTICALS[sid]) ? CORE_PRACTICALS[sid].list : []; }
function cpDoneCount(sid, paper){ return cpList(sid).filter(p => (!paper || p.p === paper) && state.cp[cpKey(sid, p.n)]).length; }

  const t = pqTotals(rows); rec.s = t.s; rec.m = t.m;

    const ex = state.mistakes.find(m => m.u === c && m.sr === sr && m.src === 'qbyq' && m.q === r.q);
    if (lost <= 0){ if (ex && !ex.fixed) state.mistakes = state.mistakes.filter(m => m !== ex); return; }
    if (ex){ Object.assign(ex, { lost, t: ti, why: r.why || ex.why }); return; }
    state.mistakes.push({ id: uid(), d: todayStr(), ts: Date.now(), rev: null, fixed: false, u: c, sr, q: r.q, lost, t: ti, why: r.why, note: '', old: null, src: 'qbyq' });

const RT_LEN = 40; // minutes per topic block

  const U = ex.map(e => {
    const u = UNIT[e.u], c = e.u;
    const topics = u.t.map((n, i) => ({ i, n, st: state.topics[topicId(c, i)] || 0, lost: topicMistakes(c, i).reduce((a, m) => a + m.lost, 0) }))
      .filter(x => x.st < 3).sort((a, b) => a.st - b.st || b.lost - a.lost);
    const res = new Set(reservedPapers(c));
    const todo = papersFor(c).filter(r => !state.papers[paperKey(c, r[0])]).sort((a, b) => seriesSortKey(b[0]) - seriesSortKey(a[0]));
    return { c, u, exam: e.d, topics, practice: todo.filter(r => !res.has(r[0]) && srBase(r[0]) !== 'Specimen').map(r => r[0]), mocks: todo.filter(r => res.has(r[0])).map(r => r[0]), lastPaper: null, mockDone: false, reviewDone: false, pmin: PAPER_MIN[c] || 90 };
  });

    if (rest >= 0 && new Date(d + 'T12:00:00').getDay() === rest) continue;

      if (!live.length) break;
      const need = x => (x.topics.length * RT_LEN + x.practice.length * 20 + (x.mockDone ? 0 : x.pmin) + 30) / Math.max(1, daysBetween(d, x.exam));
      const pick = live.slice().sort((a, b) => (need(b) * (used.has(b.c) ? 0.4 : 1)) - (need(a) * (used.has(a.c) ? 0.4 : 1)))[0];

      else if (dl <= 8 && !pick.mockDone && pick.mocks.length && left >= pick.pmin * 0.75){ pick.mockDone = true; task = { k: 'mock', m: pick.pmin, sr: pick.mocks[0], t: 'Timed mock: ' + lab + ' ' + pick.mocks[0] + ' (saved for this), then mark it' }; }

      else if (pick.practice.length && left >= pick.pmin * 0.75){ pick.lastPaper = d; const sr = pick.practice.shift(); task = { k: 'paper', m: pick.pmin, sr, t: 'Past paper: ' + lab + ' ' + sr + ', timed, then mark it' }; }

  SUBJECTS.forEach(s => s.units.forEach(u => {
    const lab = u.l + ' ' + u.n;
    add('Unit', lab, s.name + ' · ' + dispCode(u.c), u.c, { act: 'goto-rev', u: u.c }, u.c);
    u.t.forEach((t, i) => add('Topic', t, lab, u.c, { act: 'goto-rev', u: u.c }, s.name));
    const N = (typeof PMT_NOTES !== 'undefined' && PMT_NOTES[u.c]) || null;
    if (N){ (N.unit || []).forEach(n => add(n.k === 'cards' ? 'Flashcards' : 'Notes', n.n, lab, u.c, { url: n.k === 'cards' ? ((typeof PMT_DECK_PDF !== 'undefined' && PMT_DECK_PDF[n.url]) || n.url) : n.url })); Object.entries(N.t || {}).forEach(([i, arr]) => arr.forEach(n => add(n.k === 'cards' ? 'Flashcards' : 'Notes', n.n, lab + ' · ' + (u.t[+i] || ''), u.c, { url: n.k === 'cards' ? ((typeof PMT_DECK_PDF !== 'undefined' && PMT_DECK_PDF[n.url]) || n.url) : n.url }, u.t[+i]))); }
    const Q = (typeof PMT_TQ !== 'undefined' && PMT_TQ[u.c]) || {};

    if (typeof PAPERS !== 'undefined' && PAPERS[u.c]) PAPERS[u.c].forEach(r => add('Past paper', u.l + ' ' + r[0], s.name + ' · ' + dispCode(u.c), u.c, { act: 'goto-papers', u: u.c }, u.n + ' ' + r[0]));
